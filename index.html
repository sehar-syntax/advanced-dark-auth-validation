<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Authentication System</title>
    <style>
        body { 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    background: #0f172a; /* Deep premium dark background */
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
}
.form-container { 
    background: #1e293b; /* Sleek slate card background */
    padding: 35px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
    width: 350px; 
    border: 1px solid #334155; /* Subtle border text */
    transition: transform 0.3s ease;
}
.form-container:hover {
    transform: translateY(-5px); /* Smooth floating card effect on hover */
}
h2 { 
    margin-bottom: 25px; 
    color: #f8fafc; /* Crisp white header text */
    text-align: center; 
    font-size: 26px;
    letter-spacing: 0.5px;
}
.form-group { margin-bottom: 20px; position: relative; }
label { 
    display: block; 
    margin-bottom: 8px; 
    color: #94a3b8; /* Soft grayish labels for contrast */
    font-size: 13px; 
    font-weight: 500;
}
input[type="text"], input[type="email"], input[type="password"] { 
    width: 100%; 
    padding: 12px; 
    background: #0f172a; /* Inner dark background for inputs */
    border: 1px solid #475569; 
    border-radius: 8px; 
    box-sizing: border-box; 
    outline: none; 
    color: #f8fafc;
    font-size: 14px;
    transition: all 0.3s ease;
}
/* Smooth Hover aur Focus Effects inputs ke liye */
input:hover {
    border-color: #64748b;
}
input:focus {
    border-color: #38bdf8; /* Vibrant neon blue focus glow */
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
}
.error-msg { color: #f87171; font-size: 12px; margin-top: 6px; height: 15px; }
.success-border { border-color: #4ade80 !important; box-shadow: 0 0 8px rgba(74, 222, 128, 0.2); }
.error-border { border-color: #f87171 !important; box-shadow: 0 0 8px rgba(248, 113, 113, 0.2); }
.toggle-btn { 
    position: absolute; 
    right: 12px; 
    top: 36px; 
    cursor: pointer; 
    background: none; 
    border: none; 
    font-size: 16px; 
    color: #94a3b8;
}
button[type="submit"] { 
    width: 100%; 
    padding: 14px; 
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); /* Modern Gradient Button */
    border: none; 
    color: white; 
    font-size: 16px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: 600; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
}
/* Advanced Button Hover States */
button[type="submit"]:hover { 
    background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
    box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); /* Glowing effect */
    transform: scale(1.01);
}
button[type="submit"]:active {
    transform: scale(0.99);
}
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Account</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Min 5 characters">
            <div class="error-msg" id="usernameError"></div>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@domain.com">
            <div class="error-msg" id="emailError"></div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 8 characters">
            <button type="button" class="toggle-btn" id="togglePassword">👁️</button>
            <div class="error-msg" id="passwordError"></div>
        </div>
        <button type="submit">Register Now</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
